name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Desabilita clones rasos para melhor relevância da análise

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Obrigatório para a nuvem se comunicar com o PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # O token que você configurou nos Secrets
